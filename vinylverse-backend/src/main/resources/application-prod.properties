spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

server.forward-headers-strategy=framework

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.return-url=${PAYPAL_RETURN_URL}
paypal.cancel-url=${PAYPAL_CANCEL_URL}
paypal.payment-currency=${PAYPAL_PAYMENT_CURRENCY:EUR}
paypal.rsd-to-payment-rate=${PAYPAL_RSD_TO_PAYMENT_RATE:0.0085}

exchange-rate.rsd-api-url=${EXCHANGE_RATE_RSD_API_URL:https://open.er-api.com/v6/latest/RSD}
exchange-rate.cache-minutes=${EXCHANGE_RATE_CACHE_MINUTES:720}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${MAIL_FROM}
app.mail.enabled=${MAIL_ENABLED:true}
