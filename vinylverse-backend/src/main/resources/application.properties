spring.config.import=optional:file:.env[.properties],optional:file:vinylverse-backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vinlyverse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
upload.folder=${user.dir}/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=${JWT_SECRET:dev-secret-should-be-at-least-32-characters-long!!}
jwt.expiration-ms=3600000

paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:4200/checkout/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:4200/checkout/cancel}