<div class="record-card">
<img [src]="punaPutanjaSlike" [alt]="naziv" />
  <div class="info">
    <p class="title">{{ naziv }}</p>
    <p class="card-sub">{{ izdavackaKuca }}</p>
    <p class="card-sub card-zanr">{{ zanr }}</p>
    <p class="cena">{{ cena }}RSD</p>
  <div class="card-actions">
    <a [routerLink]="['/detalji', id, slug]">
      <button type="button">Detalji</button>
    </a>
    <button
      *ngIf="prikaziDodajUKorpu"
      type="button"
      class="btn-korpa"
      (click)="onDodajUKorpu($event)"
    >
      U korpu
    </button>
  </div>

  </div>
</div>
